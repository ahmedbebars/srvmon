<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="srvmon: an agent on every server posts to an n8n workflow, which alerts on Telegram and serves a dashboard">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3DD6B0"/></marker>
  </defs>
  <rect width="1200" height="640" rx="14" fill="#0D1117"/>
  <text x="24" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#9198A1" text-anchor="start">ON EVERY SERVER</text>
  <text x="452" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#9198A1" text-anchor="start">N8N</text>
  <text x="900" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#9198A1" text-anchor="start">WHERE IT SHOWS UP</text>
  <rect x="24" y="44" width="372" height="250" rx="12" fill="#161B22" stroke="#3DD6B0" stroke-width="1.5"/>
  <text x="42" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">srvmon-agent</text>
  <text x="42" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">python3 · standard library only</text>
  <circle cx="47" cy="118" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="122" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">a systemd timer runs it every minute</text>
  <circle cx="47" cy="139" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="143" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">CPU, RAM, memory pressure, disks</text>
  <circle cx="47" cy="160" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="164" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">services and Docker containers</text>
  <circle cx="47" cy="181" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="185" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">age of the newest backup</text>
  <circle cx="47" cy="202" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="206" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">logs for anything over a threshold</text>
  <circle cx="47" cy="223" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="227" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">--security once a day: SSH, fail2ban,</text>
  <text x="58" y="248" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Suricata, sudo, new ports, updates</text>
  <rect x="24" y="312" width="372" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="42" y="342" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">On the server in a shop</text>
  <circle cx="47" cy="366" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="370" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">MikroTik router over REST or SSH, read-only:</text>
  <text x="58" y="391" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">internet lines, ports, CPU, reboots</text>
  <circle cx="47" cy="408" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="412" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">printers, cameras, NVR, time clock: ping</text>
  <rect x="24" y="470" width="372" height="116" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="42" y="500" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">On one server</text>
  <circle cx="47" cy="524" r="2.5" fill="#3DD6B0"/>
  <text x="58" y="528" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">every web site: HTTP status, response</text>
  <text x="58" y="549" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">time, days left on the TLS certificate</text>
  <rect x="452" y="44" width="400" height="542" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="470" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">Server Monitor workflow</text>
  <text x="470" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">one import file · data tables</text>
  <rect x="472" y="84" width="360" height="52" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="106" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Webhook  /srvmon/in/&lt;token&gt;</text>
  <text x="486" y="125" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">one JSON report per server per minute</text>
  <rect x="472" y="150" width="360" height="70" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="172" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Evaluate Report</text>
  <text x="486" y="191" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">compares with the last state; a problem</text>
  <text x="486" y="210" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">alerts once, and once more when it is fixed</text>
  <rect x="472" y="234" width="360" height="52" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="256" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Every minute: who went quiet?</text>
  <text x="486" y="275" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">no report for 3 minutes = down</text>
  <rect x="472" y="300" width="360" height="52" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="322" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Data tables</text>
  <text x="486" y="341" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">srvmon_status · srvmon_events · srvmon_security</text>
  <rect x="472" y="366" width="360" height="52" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="388" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Webhook  /srvmon/sec/&lt;token&gt;</text>
  <text x="486" y="407" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">the daily security summary</text>
  <rect x="472" y="432" width="360" height="52" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="454" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">09:00 daily report · 09:10 security digest</text>
  <text x="486" y="473" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">one message each, on a schedule</text>
  <rect x="472" y="498" width="360" height="70" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <text x="486" y="520" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Dashboard page</text>
  <text x="486" y="539" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">HTML built from the data tables,</text>
  <text x="486" y="558" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="start">behind Basic Auth</text>
  <rect x="900" y="44" width="276" height="196" rx="12" fill="#161B22" stroke="#3DD6B0" stroke-width="1.5"/>
  <text x="918" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">Telegram</text>
  <circle cx="923" cy="98" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="102" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">a problem opens: one alert</text>
  <circle cx="923" cy="119" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="123" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">the logs, as a reply under it</text>
  <circle cx="923" cy="140" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="144" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">it is fixed: how long it lasted</text>
  <circle cx="923" cy="161" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="165" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">the daily report</text>
  <circle cx="923" cy="182" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="186" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">the security digest</text>
  <rect x="900" y="258" width="276" height="82" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="918" y="288" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">WhatsApp</text>
  <text x="918" y="318" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">optional, same alerts (Cloud API)</text>
  <rect x="900" y="452" width="276" height="134" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="918" y="482" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E6EDF3" text-anchor="start">Browser or phone</text>
  <circle cx="923" cy="506" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="510" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">the dashboard, every minute</text>
  <circle cx="923" cy="527" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="531" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">light or dark, as the device is</text>
  <circle cx="923" cy="548" r="2.5" fill="#3DD6B0"/>
  <text x="934" y="552" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">English or Arabic (right to left)</text>
  <path d="M396 169 H424 M396 382 H424 M396 528 H424 M424 110 V528" stroke="#3DD6B0" stroke-width="2" fill="none"/>
  <path d="M424 110 L470 110" stroke="#3DD6B0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M424 392 L470 392" stroke="#3DD6B0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#9198A1" text-anchor="start">POST</text>
  <path d="M832 185 H876 M832 458 H876 M876 140 V458" stroke="#3DD6B0" stroke-width="2" fill="none"/>
  <path d="M876 140 L898 140" stroke="#3DD6B0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M876 298 L898 298" stroke="#3DD6B0" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
  <path d="M898 532 L834 532" stroke="#3DD6B0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="846" y="524" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#9198A1" text-anchor="start">GET</text>
</svg>
